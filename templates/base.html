{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Newspaper App{% endblock title %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link href='{% static 'css/base.css' %}' rel='stylesheet'>
</head>

  <body class="d-flex flex-column min-vh-100">
    <header class="p-3 navbar-custom">
      <div class ="container-fluid header-layout">
        <div class="header-spacer" aria-hidden="true"></div>
        <a href="{% url 'home' %}" class="nav-link px-2 home-link">CONVOCARE</a>
        <div class="header-actions">
          {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
          </form>
          {% else %}
          <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Iniciar Sesión</a>
          <a href="{% url 'signup' %}" class="btn btn-secondary btn-sm">Registrarse</a>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="flex-grow-1">
      <div class="container">
        {% block content %}
        {% endblock content %}
      </div>
    </main>
    <footer class="container-fluid py-3 mt-4 border-top footer">
      <a href="{% url 'contact' %}">Contacto</a>
    </footer>
    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
